<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🐾 貓貓健康記錄器</title>
  
  <!-- PWA & 桌面 App 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="貓貓紀錄">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/616/616408.png">
  
  <!-- Tailwind CSS & Alpine.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <!-- Chart.js 圖表庫 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    [x-cloak] { display: none !important; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-amber-50/40 text-slate-800 min-h-screen pb-24 font-sans select-none" x-data="catApp()" x-cloak>

  <!-- 頂部 Header -->
  <header class="bg-orange-400 text-white p-4 shadow-md sticky top-0 z-30 flex justify-between items-center">
    <h1 class="text-xl font-bold flex items-center gap-2">
      <span>🐾</span>
      <span x-text="cat ? cat.name + '的健康日誌' : '貓貓健康記錄器'"></span>
    </h1>
    <template x-if="cat">
      <button @click="switchCat()" class="text-xs bg-orange-500 hover:bg-orange-600 px-3 py-1.5 rounded-full border border-orange-300 shadow-sm transition active:scale-95">
        切換 / 新增貓貓
      </button>
    </template>
  </header>

  <main class="max-w-md mx-auto p-4">

    <!-- 未選擇 / 未新增貓貓時顯示 -->
    <template x-if="!cat">
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-orange-100 text-center my-6 space-y-4">
        <div class="text-5xl mb-2">🐱</div>
        <h2 class="text-lg font-bold text-slate-700">歡迎使用貓貓紀錄 App</h2>
        <p class="text-sm text-slate-500 mb-4">請先建立一位貓貓家人吧！</p>
        
        <div class="space-y-3 text-left">
          <div>
            <label class="text-xs text-slate-500 font-bold block mb-1">貓貓名字 *</label>
            <input type="text" x-model="newCat.name" placeholder="例如: 阿咪" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
          </div>
          <div>
            <label class="text-xs text-slate-500 font-bold block mb-1">生日 (選填，自動計算年齡)</label>
            <input type="date" x-model="newCat.birthday" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none">
          </div>
          <div>
            <label class="text-xs text-slate-500 font-bold block mb-1">貓貓相片 (選填)</label>
            <input type="file" @change="handlePhotoUpload($event, newCat)" accept="image/*" class="w-full text-xs text-slate-500">
          </div>
          <button @click="addCat()" class="w-full bg-orange-400 text-white font-bold py-3 rounded-xl shadow-md hover:bg-orange-500 transition active:scale-95 mt-2">
            + 開始紀錄
          </button>
        </div>

        <!-- 備份還原區域 -->
        <div class="mt-8 pt-6 border-t border-slate-100">
          <button @click="showRestore = !showRestore" class="text-xs text-slate-400 underline">
            已有備份碼？按此還原資料
          </button>
          <div x-show="showRestore" class="mt-3 space-y-2">
            <textarea x-model="restoreCode" placeholder="貼上備份碼..." class="w-full text-xs p-2 border rounded-lg h-20 focus:outline-none"></textarea>
            <button @click="restoreData()" class="w-full bg-slate-700 text-white text-xs py-2 rounded-lg font-bold">
              從備份碼還原
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- 已選擇貓貓時的主介面 -->
    <template x-if="cat">
      <div>
        <!-- 貓貓基本資料卡片 (包含相片與年齡) -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-orange-100 mb-4 flex items-center gap-4">
          <div class="relative w-16 h-16 rounded-full overflow-hidden bg-orange-100 border-2 border-orange-300 flex-shrink-0 flex items-center justify-center">
            <template x-if="cat.photo">
              <img :src="cat.photo" class="w-full h-full object-cover">
            </template>
            <template x-if="!cat.photo">
              <span class="text-3xl">🐱</span>
            </template>
          </div>
          <div class="flex-grow">
            <h2 class="text-lg font-bold text-slate-800" x-text="cat.name"></h2>
            <p class="text-xs text-slate-500" x-text="getAgeString(cat.birthday)"></p>
            <p class="text-xs text-orange-500 mt-0.5" x-text="latestWeightText"></p>
          </div>
        </div>

        <!-- 多隻貓貓選單 -->
        <div x-show="cats.length > 1" class="flex gap-2 mb-4 overflow-x-auto pb-1">
          <template x-for="c in cats" :key="c.id">
            <button @click="selectCat(c.id)" 
                    :class="cat.id === c.id ? 'bg-orange-400 text-white font-bold' : 'bg-white text-slate-600 border border-slate-200'"
                    class="px-3.5 py-1.5 rounded-xl text-xs whitespace-nowrap shadow-sm transition">
              <span x-text="c.name"></span>
            </button>
          </template>
        </div>

        <!-- 分頁 1: ⚖️ 體重紀錄 -->
        <div x-show="tab === 'weight'" class="space-y-4">
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-orange-100">
            <h3 class="font-bold text-slate-700 mb-3 flex items-center gap-1.5 text-sm">
              <span>⚖️</span> 新增體重紀錄
            </h3>
            <div class="flex gap-2">
              <input type="date" x-model="weightInput.date" class="px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none">
              <input type="number" step="0.01" x-model="weightInput.kg" placeholder="體重 (kg)" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none">
              <button @click="addWeight()" class="bg-orange-400 text-white font-bold px-4 rounded-xl text-sm hover:bg-orange-500 transition whitespace-nowrap">
                新增
              </button>
            </div>
          </div>

          <!-- 📈 體重趨勢圖表 -->
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-orange-100">
            <h3 class="font-bold text-slate-700 mb-3 flex items-center gap-1.5 text-sm">
              <span>📈</span> 體重變化趨勢
            </h3>
            <div style="position: relative; height: 220px; width: 100%;">
              <canvas id="weightChart"></canvas>
            </div>
          </div>

          <!-- 歷史紀錄 -->
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-orange-100">
            <h3 class="font-bold text-slate-700 mb-3 text-sm">歷史紀錄</h3>
            <div class="space-y-2 max-h-56 overflow-y-auto">
              <template x-for="(w, idx) in sortedWeights" :key="idx">
                <div class="flex justify-between items-center p-2.5 bg-slate-50 rounded-xl text-sm">
                  <span class="text-slate-500" x-text="w.date"></span>
                  <div class="flex items-center gap-3">
                    <span class="font-bold text-slate-700" x-text="w.kg + ' kg'"></span>
                    <button @click="deleteWeight(w)" class="text-red-400 hover:text-red-600 text-xs">刪除</button>
                  </div>
                </div>
              </template>
              <p x-show="!cat.weights || cat.weights.length === 0" class="text-xs text-slate-400 text-center py-4">仲未有體重紀錄</p>
            </div>
          </div>
        </div>

        <!-- 分頁 2: 🏥 醫療紀錄 -->
        <div x-show="tab === 'medical'" class="space-y-4">
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-orange-100 space-y-3">
            <h3 class="font-bold text-slate-700 text-sm flex items-center gap-1.5">
              <span>🏥</span> 新增診斷 / 睇醫生紀錄
            </h3>
            <input type="date" x-model="medicalInput.date" class="w-full px-3 py-2 rounded-xl border text-sm">
            <input type="text" x-model="medicalInput.clinic" placeholder="診所 / 醫生名稱" class="w-full px-3 py-2 rounded-xl border text-sm">
            <input type="text" x-model="medicalInput.reason" placeholder="睇醫生原因 (例: 打疫苗/發燒)" class="w-full px-3 py-2 rounded-xl border text-sm">
            <textarea x-model="medicalInput.note" placeholder="醫囑 / 用藥說明..." class="w-full px-3 py-2 rounded-xl border text-sm h-20"></textarea>
            <button @click="addMedical()" class="w-full bg-orange-400 text-white font-bold py-2.5 rounded-xl text-sm shadow hover:bg-orange-500 transition">
              儲存醫療紀錄
            </button>
          </div>

          <div class="space-y-3">
            <template x-for="(m, idx) in (cat.medicals || [])" :key="idx">
              <div class="bg-white rounded-2xl p-4 shadow-sm border border-orange-100 space-y-1 relative">
                <button @click="deleteMedical(idx)" class="absolute top-3 right-3 text-xs text-red-400">刪除</button>
                <div class="text-xs text-orange-500 font-bold" x-text="m.date"></div>
                <div class="font-bold text-slate-800 text-sm" x-text="m.reason"></div>
                <div class="text-xs text-slate-500" x-text="'診所: ' + (m.clinic || '未填寫')"></div>
                <div x-show="m.note" class="text-xs bg-amber-50 p-2.5 rounded-xl text-slate-600 mt-2 whitespace-pre-line" x-text="m.note"></div>
              </div>
            </template>
          </div>
        </div>

        <!-- 分頁 3: 📘 生活紀錄 -->
        <div x-show="tab === 'life'" class="space-y-4">
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-orange-100 space-y-3">
            <h3 class="font-bold text-slate-700 text-sm flex items-center gap-1.5">
              <span>📘</span> 記低日常生活瑣事
            </h3>
            <input type="date" x-model="lifeInput.date" class="w-full px-3 py-2 rounded-xl border text-sm">
            <select x-model="lifeInput.tag" class="w-full px-3 py-2 rounded-xl border text-sm bg-white">
              <option value="🍽️ 飲食">🍽️ 飲食 / 轉糧</option>
              <option value="💩 便便">💩 便便 / 尿尿情況</option>
              <option value="✂️ 剪指甲">✂️ 剪指甲 / 梳毛</option>
              <option value="💊 食藥">💊 食藥 / 驅蟲</option>
              <option value="🎯 其它">🎯 其它生活記事</option>
            </select>
            <textarea x-model="lifeInput.note" placeholder="寫下注意事項..." class="w-full px-3 py-2 rounded-xl border text-sm h-20"></textarea>
            <button @click="addLife()" class="w-full bg-orange-400 text-white font-bold py-2.5 rounded-xl text-sm shadow hover:bg-orange-500 transition">
              新增生活記事
            </button>
          </div>

          <div class="space-y-3">
            <template x-for="(l, idx) in (cat.lives || [])" :key="idx">
              <div class="bg-white rounded-2xl p-4 shadow-sm border border-orange-100 space-y-1 relative">
                <button @click="deleteLife(idx)" class="absolute top-3 right-3 text-xs text-red-400">刪除</button>
                <div class="flex items-center gap-2">
                  <span class="text-xs bg-orange-100 text-orange-600 px-2 py-0.5 rounded-md font-bold" x-text="l.tag"></span>
                  <span class="text-xs text-slate-400" x-text="l.date"></span>
                </div>
                <div class="text-sm text-slate-700 mt-1 whitespace-pre-line" x-text="l.note"></div>
              </div>
            </template>
          </div>
        </div>

        <!-- 分頁 4: 🔔 驅蟲打針提醒 -->
        <div x-show="tab === 'reminder'" class="space-y-4">
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-orange-100 space-y-3">
            <h3 class="font-bold text-slate-700 text-sm flex items-center gap-1.5">
              <span>🔔</span> 設定驅蟲 / 疫苗預約提醒
            </h3>
            <div class="space-y-2">
              <div>
                <label class="text-xs text-slate-500 block mb-1">下一次體外/體內驅蟲日期：</label>
                <input type="date" x-model="cat.fleaDate" @change="save()" class="w-full px-3 py-2 rounded-xl border text-sm">
              </div>
              <div>
                <label class="text-xs text-slate-500 block mb-1">下一次預防針/疫苗日期：</label>
                <input type="date" x-model="cat.vaccineDate" @change="save()" class="w-full px-3 py-2 rounded-xl border text-sm">
              </div>
            </div>
          </div>
        </div>

        <!-- 分頁 5: ⚙️ 設定 -->
        <div x-show="tab === 'setting'" class="space-y-4">
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-orange-100 space-y-3">
            <h3 class="font-bold text-slate-700 text-sm">更改貓貓資料 / 相片</h3>
            <div class="space-y-2">
              <input type="text" x-model="cat.name" @change="save()" placeholder="貓貓名字" class="w-full px-3 py-2 rounded-xl border text-sm">
              <div>
                <label class="text-xs text-slate-500 block mb-1">生日日期：</label>
                <input type="date" x-model="cat.birthday" @change="save()" class="w-full px-3 py-2 rounded-xl border text-sm">
              </div>
              <div>
                <label class="text-xs text-slate-500 block mb-1">更新相片：</label>
                <input type="file" @change="handlePhotoUpload($event, cat)" accept="image/*" class="w-full text-xs text-slate-500">
              </div>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-4 shadow-sm border border-orange-100 space-y-3">
            <h3 class="font-bold text-slate-700 text-sm">資料備份與還原</h3>
            <button @click="copyBackup()" class="w-full bg-slate-800 text-white font-bold py-2.5 rounded-xl text-sm shadow">
              📋 複製備份碼
            </button>

            <div class="pt-3 border-t border-slate-100 space-y-2">
              <textarea x-model="restoreCode" placeholder="貼上備份碼..." class="w-full text-xs p-2 border rounded-xl h-20 focus:outline-none"></textarea>
              <button @click="restoreData()" class="w-full bg-orange-400 text-white text-xs font-bold py-2 rounded-xl">
                還原資料
              </button>
            </div>
          </div>
        </div>

      </div>
    </template>

  </main>

  <!-- 底部導覽列 -->
  <template x-if="cat">
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-2 py-2 flex justify-around items-center z-30 shadow-lg max-w-md mx-auto text-xs">
      <button @click="changeTab('weight')" :class="tab === 'weight' ? 'text-orange-500 font-bold' : 'text-slate-400'" class="flex flex-col items-center gap-0.5">
        <span class="text-base">⚖️</span> 體重
      </button>
      <button @click="changeTab('medical')" :class="tab === 'medical' ? 'text-orange-500 font-bold' : 'text-slate-400'" class="flex flex-col items-center gap-0.5">
        <span class="text-base">🏥</span> 醫療
      </button>
      <button @click="changeTab('life')" :class="tab === 'life' ? 'text-orange-500 font-bold' : 'text-slate-400'" class="flex flex-col items-center gap-0.5">
        <span class="text-base">📘</span> 生活
      </button>
      <button @click="changeTab('reminder')" :class="tab === 'reminder' ? 'text-orange-500 font-bold' : 'text-slate-400'" class="flex flex-col items-center gap-0.5">
        <span class="text-base">🔔</span> 提醒
      </button>
      <button @click="changeTab('setting')" :class="tab === 'setting' ? 'text-orange-500 font-bold' : 'text-slate-400'" class="flex flex-col items-center gap-0.5">
        <span class="text-base">⚙️️</span> 設定
      </button>
    </nav>
  </template>

  <script>
    function catApp() {
      return {
        tab: 'weight',
        cats: [],
        currentCatId: null,
        newCat: { name: '', birthday: '', photo: '' },
        chart: null,
        showRestore: false,
        restoreCode: '',

        weightInput: { date: new Date().toISOString().split('T')[0], kg: '' },
        medicalInput: { date: new Date().toISOString().split('T')[0], clinic: '', reason: '', note: '' },
        lifeInput: { date: new Date().toISOString().split('T')[0], tag: '🍽️ 飲食', note: '' },

        init() {
          const saved = localStorage.getItem('cat_app_data');
          if (saved) {
            try {
              const data = JSON.parse(saved);
              this.cats = data.cats || [];
              this.currentCatId = data.currentCatId || (this.cats[0] ? this.cats[0].id : null);
            } catch(e) {}
          }
          this.$nextTick(() => { this.drawChart(); });
        },

        get cat() {
          return this.cats.find(c => c.id === this.currentCatId) || null;
        },

        get sortedWeights() {
          if (!this.cat || !this.cat.weights) return [];
          return [...this.cat.weights].sort((a,b) => b.date.localeCompare(a.date));
        },

        get latestWeightText() {
          if (!this.cat || !this.cat.weights || this.cat.weights.length === 0) return '尚未有體重紀錄';
          const latest = this.sortedWeights[0];
          return `最新體重: ${latest.kg} kg (${latest.date})`;
        },

        getAgeString(bday) {
          if (!bday) return '未設定生日';
          const birth = new Date(bday);
          const now = new Date();
          let years = now.getFullYear() - birth.getFullYear();
          let months = now.getMonth() - birth.getMonth();
          if (months < 0) { years--; months += 12; }
          if (years <= 0 && months <= 0) return '剛出生';
          if (years <= 0) return `${months} 個月大`;
          return `${years} 歲 ${months} 個月大`;
        },

        save() {
          localStorage.setItem('cat_app_data', JSON.stringify({
            cats: this.cats,
            currentCatId: this.currentCatId
          }));
        },

        changeTab(t) {
          this.tab = t;
          if (t === 'weight') {
            this.drawChart();
          }
        },

        handlePhotoUpload(event, targetObj) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            targetObj.photo = e.target.result;
            this.save();
          };
          reader.readAsDataURL(file);
        },

        addCat() {
          if (!this.newCat.name.trim()) return;
          const created = {
            id: Date.now(),
            name: this.newCat.name.trim(),
            birthday: this.newCat.birthday,
            photo: this.newCat.photo,
            fleaDate: '',
            vaccineDate: '',
            weights: [],
            medicals: [],
            lives: []
          };
          this.cats.push(created);
          this.currentCatId = created.id;
          this.newCat = { name: '', birthday: '', photo: '' };
          this.save();
          this.$nextTick(() => { this.drawChart(); });
        },

        selectCat(id) {
          this.currentCatId = id;
          this.save();
          this.drawChart();
        },

        switchCat() {
          this.currentCatId = null;
        },

        addWeight() {
          if (!this.weightInput.kg || !this.cat) return;
          if (!this.cat.weights) this.cat.weights = [];
          this.cat.weights.push({
            date: this.weightInput.date,
            kg: parseFloat(this.weightInput.kg)
          });
          this.weightInput.kg = '';
          this.save();
          this.drawChart();
        },

        deleteWeight(w) {
          this.cat.weights = this.cat.weights.filter(item => item !== w);
          this.save();
          this.drawChart();
        },

        drawChart() {
          if (this.tab !== 'weight' || !this.cat) return;
          
          setTimeout(() => {
            const cv = document.getElementById('weightChart');
            if (!cv) return;
            
            const ws = [...(this.cat.weights || [])].sort((a, b) => a.date.localeCompare(b.date));
            
            if (this.chart) { 
              this.chart.destroy(); 
              this.chart = null; 
            }
            
            if (ws.length === 0) return;

            this.chart = new Chart(cv, {
              type: 'line',
              data: {
                labels: ws.map(w => w.date.slice(5)),
                datasets: [{ 
                  label: '體重 (kg)', 
                  data: ws.map(w => w.kg), 
                  borderColor: '#f9a98f', 
                  backgroundColor: 'rgba(249,169,143,.2)', 
                  fill: true, 
                  tension: 0.35, 
                  pointBackgroundColor: '#fff', 
                  pointBorderColor: '#f26f4e', 
                  pointBorderWidth: 2, 
                  pointRadius: 5 
                }]
              },
              options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                plugins: { legend: { display: false } }, 
                scales: { y: { title: { display: true, text: 'kg' } } } 
              }
            });
          }, 100);
        },

        addMedical() {
          if (!this.medicalInput.reason || !this.cat) return;
          if (!this.cat.medicals) this.cat.medicals = [];
          this.cat.medicals.unshift({ ...this.medicalInput });
          this.medicalInput.reason = '';
          this.medicalInput.note = '';
          this.save();
        },

        deleteMedical(idx) {
          this.cat.medicals.splice(idx, 1);
          this.save();
        },

        addLife() {
          if (!this.lifeInput.note || !this.cat) return;
          if (!this.cat.lives) this.cat.lives = [];
          this.cat.lives.unshift({ ...this.lifeInput });
          this.lifeInput.note = '';
          this.save();
        },

        deleteLife(idx) {
          this.cat.lives.splice(idx, 1);
          this.save();
        },

        copyBackup() {
          const str = btoa(unescape(encodeURIComponent(JSON.stringify({ cats: this.cats }))));
          navigator.clipboard.writeText(str).then(() => {
            alert('已複製備份碼到剪貼簿！');
          }).catch(() => {
            prompt('請複製以下備份碼：', str);
          });
        },

        restoreData() {
          if (!this.restoreCode.trim()) return;
          try {
            const decoded = JSON.parse(decodeURIComponent(escape(atob(this.restoreCode.trim()))));
            if (decoded.cats) {
              this.cats = decoded.cats;
              this.currentCatId = this.cats[0] ? this.cats[0].id : null;
              this.save();
              alert('還原成功！');
              this.restoreCode = '';
              this.drawChart();
            }
          } catch(e) {
            alert('備份碼格式錯誤。');
          }
        }
      }
    }
  </script>
</body>
</html>
