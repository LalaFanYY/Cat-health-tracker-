<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>貓貓健康與生活紀錄器</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="貓貓紀錄">
  <meta name="theme-color" content="#faf9f5">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    :root { --bg:#faf9f5; --card:#ffffff; --accent:#e07a5f; --text:#3d405b; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-bottom: 80px; }
    .nav-btn.active { color: var(--accent); font-weight: bold; }
    .card { background: var(--card); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
  </style>
</head>
<body class="max-w-md mx-auto p-4">

  <!-- Header -->
  <header class="flex justify-between items-center mb-6 pt-2">
    <div>
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <span>🐾</span> 貓貓健康與生活紀錄
      </h1>
      <p class="text-xs text-gray-500">100% 本地私隱安全儲存</p>
    </div>
    <select id="catSelect" onchange="switchCat(this.value)" class="bg-white border rounded-lg px-2 py-1 text-sm font-semibold shadow-sm">
      <!-- Cats options -->
    </select>
  </header>

  <!-- Content Container -->
  <main id="appContent">
    <!-- Dynamic Views -->
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t flex justify-around py-3 px-2 z-50 text-xs text-gray-500">
    <button onclick="switchTab('health')" id="nav-health" class="nav-btn active flex flex-col items-center gap-1">
      <i data-lucide="activity" class="w-5 h-5"></i>健康紀錄
    </button>
    <button onclick="switchTab('life')" id="nav-life" class="nav-btn flex flex-col items-center gap-1">
      <i data-lucide="book-open" class="w-5 h-5"></i>生活行為
    </button>
    <button onclick="switchTab('vets')" id="nav-vets" class="nav-btn flex flex-col items-center gap-1">
      <i data-lucide="building-2" class="w-5 h-5"></i>診所通訊錄
    </button>
    <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col items-center gap-1">
      <i data-lucide="settings" class="w-5 h-5"></i>設定/備份
    </button>
  </nav>

  <script>
    // State Initialization
    let db = JSON.parse(localStorage.getItem('catDB_v2')) || {
      currentCatId: 'default',
      cats: [{ id: 'default', name: '咪咪', age: '', gender: '公' }],
      weights: [],
      medical: [],
      lifeLogs: [],
      vets: []
    };

    let currentTab = 'health';

    function saveDB() {
      localStorage.setItem('catDB_v2', JSON.stringify(db));
    }

    function init() {
      renderCatSelect();
      switchTab('health');
      lucide.createIcons();
    }

    function renderCatSelect() {
      const select = document.getElementById('catSelect');
      select.innerHTML = db.cats.map(c => `<option value="${c.id}" ${c.id === db.currentCatId ? 'selected' : ''}>${c.name}</option>`).join('') + `<option value="ADD_NEW">+ 新增貓貓</option>`;
    }

    function switchCat(id) {
      if(id === 'ADD_NEW') {
        const name = prompt("請輸入新貓貓名字：");
        if(name) {
          const newId = 'cat_' + Date.now();
          db.cats.push({ id: newId, name, age: '', gender: '公' });
          db.currentCatId = newId;
          saveDB();
        }
      } else {
        db.currentCatId = id;
      }
      renderCatSelect();
      renderCurrentTab();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`nav-${tab}`).classList.add('active');
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const container = document.getElementById('appContent');
      if (currentTab === 'health') renderHealthTab(container);
      else if (currentTab === 'life') renderLifeTab(container);
      else if (currentTab === 'vets') renderVetsTab(container);
      else if (currentTab === 'settings') renderSettingsTab(container);
      lucide.createIcons();
    }

    // --- 1. HEALTH TAB ---
    function renderHealthTab(container) {
      const currentCat = db.cats.find(c => c.id === db.currentCatId);
      const catWeights = db.weights.filter(w => w.catId === db.currentCatId);
      const catMedical = db.medical.filter(m => m.catId === db.currentCatId);

      container.innerHTML = `
        <!-- Weight Section -->
        <div class="card p-4 mb-4">
          <h3 class="font-bold mb-2 flex justify-between items-center text-sm">
            <span>⚖️ 體重紀錄 (${currentCat?.name})</span>
            <button onclick="addWeight()" class="text-xs bg-orange-100 text-orange-600 px-2 py-1 rounded-full">+ 紀錄體重</button>
          </h3>
          <div class="h-32 mb-2"><canvas id="weightChart"></canvas></div>
        </div>

        <!-- Medical Section -->
        <div class="card p-4">
          <h3 class="font-bold mb-3 flex justify-between items-center text-sm">
            <span>🩺 醫療與疫苗紀錄</span>
            <button onclick="addMedical()" class="text-xs bg-orange-100 text-orange-600 px-2 py-1 rounded-full">+ 新增紀錄</button>
          </h3>
          <div class="space-y-3">
            ${catMedical.length === 0 ? '<p class="text-xs text-gray-400 text-center py-4">暫無醫療紀錄</p>' : 
              catMedical.map(m => {
                const vet = db.vets.find(v => v.id === m.vetId);
                return `
                <div class="border-b pb-2 text-xs">
                  <div class="flex justify-between font-semibold text-gray-700">
                    <span>${m.date} -${m.type}</span>
                    <span class="text-orange-500">${vet ? '📍 ' + vet.name : ''}</span>
                  </div>
                  <p class="text-gray-600 mt-1">${m.title}</p>${m.note ? `<p class="text-gray-400 mt-0.5">${m.note}</p>` : ''}
                </div>`;
              }).join('')
            }
          </div>
        </div>
      `;
      initChart(catWeights);
    }

    function addWeight() {
      const w = prompt("請輸入體重 (kg)：");
      if(w) {
        db.weights.push({ catId: db.currentCatId, date: new Date().toISOString().split('T')[0], weight: parseFloat(w) });
        saveDB();
        renderCurrentTab();
      }
    }

    function addMedical() {
      const type = prompt("類型 (如：打針/看診/體檢/驅蟲)：", "打針");
      const title = prompt("項目說明 (如：三合一疫苗/皮膚科檢查)：");
      if(!title) return;
      
      let vetOptions = "選擇診所數字：\n0: 不指定\n" + db.vets.map((v, i) => `${i+1}: ${v.name}`).join('\n');
      const vetChoice = prompt(vetOptions, "0");
      let vetId = "";
      if(vetChoice && parseInt(vetChoice) > 0 && db.vets[parseInt(vetChoice)-1]) {
        vetId = db.vets[parseInt(vetChoice)-1].id;
      }

      const note = prompt("備註/醫囑 (可留空)：", "");

      db.medical.push({
        id: Date.now(),
        catId: db.currentCatId,
        date: new Date().toISOString().split('T')[0],
        type, title, vetId, note
      });
      saveDB();
      renderCurrentTab();
    }

    // --- 2. LIFE TAB (NEW) ---
    function renderLifeTab(container) {
      const catLife = db.lifeLogs.filter(l => l.catId === db.currentCatId);

      container.innerHTML = `
        <div class="card p-4">
          <div class="flex justify-between items-center mb-4">
            <div>
              <h3 class="font-bold text-sm">📘 生活與行為紀錄</h3>
              <p class="text-xs text-gray-400">紀錄挑食、情緒、特別行為等日常</p>
            </div>
            <button onclick="addLifeLog()" class="text-xs bg-orange-500 text-white px-3 py-1.5 rounded-lg shadow">+ 新增紀錄</button>
          </div>

          <div class="space-y-4">
            ${catLife.length === 0 ? '<p class="text-xs text-gray-400 text-center py-8">暫無生活紀錄，快點擊右上角新增吧！</p>' : 
              catLife.map(l => `
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
                  <div class="flex justify-between items-center text-xs text-gray-500 mb-1">
                    <span class="bg-orange-100 text-orange-600 px-2 py-0.5 rounded-md font-semibold">${l.category}</span>
                    <span>${l.date}</span>
                  </div>
                  <p class="text-sm font-medium text-gray-800 mt-1">${l.content}</p>
                </div>
              `).join('')
            }
          </div>
        </div>
      `;
    }

    function addLifeLog() {
      const category = prompt("請選擇類別 (如：飲食/行為/情緒/環境/其他)：", "行為");
      const content = prompt("請輸入詳細紀錄內容：");
      if(!content) return;

      db.lifeLogs.unshift({
        id: Date.now(),
        catId: db.currentCatId,
        date: new Date().toISOString().split('T')[0],
        category, content
      });
      saveDB();
      renderCurrentTab();
    }

    // --- 3. VETS TAB (NEW) ---
    function renderVetsTab(container) {
      container.innerHTML = `
        <div class="card p-4">
          <div class="flex justify-between items-center mb-4">
            <div>
              <h3 class="font-bold text-sm">🏥 獸醫診所通訊錄</h3>
              <p class="text-xs text-gray-400">管理常用診所及急診資訊</p>
            </div>
            <button onclick="addVet()" class="text-xs bg-orange-500 text-white px-3 py-1.5 rounded-lg shadow">+ 新增診所</button>
          </div>

          <div class="space-y-3">
            ${db.vets.length === 0 ? '<p class="text-xs text-gray-400 text-center py-8">未有診所資料，請點擊右上角新增</p>' : 
              db.vets.map(v => `
                <div class="border p-3 rounded-xl relative">
                  <h4 class="font-bold text-sm text-gray-800">${v.name}</h4>${v.doctor ? `<p class="text-xs text-gray-600 mt-1">👨‍⚕️ 常用醫生：${v.doctor}</p>` : ''}
                  ${v.phone ? `<p class="text-xs text-blue-600 mt-1"><a href="tel:${v.phone}" class="flex items-center gap-1">📞 ${v.phone} (點擊撥號)</a></p>` : ''}
                  ${v.address ? `<p class="text-xs text-gray-500 mt-1">📍 ${v.address}</p>` : ''}
                  ${v.note ? `<p class="text-xs text-gray-400 mt-1 bg-gray-50 p-1.5 rounded">💡 ${v.note}</p>` : ''}
                </div>
              `).join('')
            }
          </div>
        </div>
      `;
    }

    function addVet() {
      const name = prompt("診所名稱 (例如：XX動物醫院)：");
      if(!name) return;
      const phone = prompt("電話號碼：", "");
      const doctor = prompt("主治/推薦醫生姓名 (可留空)：", "");
      const address = prompt("診所地址 (可留空)：", "");
      const note = prompt("備註 (例如：24小時急診 / 需要提前預約)：", "");

      db.vets.push({ id: 'vet_' + Date.now(), name, phone, doctor, address, note });
      saveDB();
      renderCurrentTab();
    }

    // --- 4. SETTINGS TAB ---
    function renderSettingsTab(container) {
      container.innerHTML = `
        <div class="card p-4 space-y-4">
          <h3 class="font-bold text-sm">⚙️ 資料管理與備份</h3>
          <button onclick="exportData()" class="w-full bg-gray-800 text-white text-xs py-2.5 rounded-lg font-medium">複製資料備份碼</button>
          <button onclick="importData()" class="w-full border border-gray-300 text-xs py-2.5 rounded-lg font-medium">匯入備份資料</button>
        </div>
      `;
    }

    function exportData() {
      navigator.clipboard.writeText(JSON.stringify(db));
      alert("備份資料已複製到剪貼簿！");
    }

    function importData() {
      const code = prompt("請貼上備份資料碼：");
      if(code) {
        try {
          db = JSON.parse(code);
          saveDB();
          alert("匯入成功！");
          location.reload();
        } catch(e) { alert("無效的資料格式！"); }
      }
    }

    function initChart(weights) {
      const ctx = document.getElementById('weightChart');
      if(!ctx) return;
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: weights.map(w => w.date),
          datasets: [{ label: '體重(kg)', data: weights.map(w => w.weight), borderColor: '#e07a5f', tension: 0.3 }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    window.onload = init;
  </script>
</body>
</html>
